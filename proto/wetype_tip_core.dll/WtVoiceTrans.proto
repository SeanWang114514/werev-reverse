// file: WtVoiceTrans.proto  package: com.tencent.wetype.pb  syntax: proto3  deps: ['BaseRequest.proto', 'BaseResponse.proto', 'ABTestHitedInfo.proto']
package com.tencent.wetype.pb;
message ImeVoiceTransCell {
  optional string voiceid = 1;
  optional bytes text = 2;
  optional uint32 seq = 3;
  optional uint32 endflag = 4;
  optional uint32 status = 5;
}
message ImeVoiceTransRequest {
  optional message<.com.tencent.wetype.pb.BaseRequest> baseRequest = 1;
  optional string language = 2;
  optional uint32 languageType = 3;
  optional uint32 scene = 4;
  optional string voiceid = 5;
  optional bytes data = 6;
  optional uint32 seq = 7;
  optional uint32 endFlag = 8;
  optional uint32 encodeType = 9;
  optional bytes vadVersion = 10;
  repeated string fetchVoiceIds = 11;
  optional bool ch_simp2trad = 12;
  optional uint64 ime_uin = 13;
  optional string ime_client_version = 14;
  optional int32 ime_client_device_type = 15;
  optional string sessionid = 16;
  optional uint32 session_seq = 17;
  optional uint32 session_endflag = 18;
  optional uint32 session_mixmode = 19;
  optional bytes client_fusion_result = 20;
  optional uint32 client_fusion_result_seq = 21;
  optional uint32 experiment_label = 22;
}
message ImeVoiceTransResponse {
  optional message<.com.tencent.wetype.pb.BaseResponse> baseResponse = 1;
  repeated message<.com.tencent.wetype.pb.ImeVoiceTransCell> vtList = 2;
  optional uint32 interval = 3;
  optional uint32 maxPacketSize = 4;
  optional bytes session_trans_text = 5;
  optional uint64 session_trans_endflag = 6;
  repeated string session_finished_voiceids = 7;
  optional bytes session_finished_session_text = 8;
  optional string last_finished_voice_id = 9;
  optional bytes session_vad1_candidate_text = 10;
  optional uint32 session_vad1_text_len = 11;
  optional message<.com.tencent.wetype.pb.ErrInfo> err_info = 12;
  optional bytes report_info = 13;
}
message ErrInfo {
  optional int32 errcode = 1;
  optional bytes errmsg = 2;
}
message ImeVoiceTranslateReq {
  optional bytes voice_data = 1;
}
message ImeVoiceTranslateResp {
  optional bytes translate_result = 1;
  repeated message<.com.tencent.wetype.pb.ABTestHitedInfo> ab_test_hited_info = 2;
}
enum SceneFlag {
  SceneNone = 0;
  SceneEmoji = 1;
}