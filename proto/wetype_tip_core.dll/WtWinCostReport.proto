  optional string device_type = 2;
  optional int64 version = 3;
  optional int64 process_id = 4;
  optional string process_name = 5;
  optional int64 key_type = 6;
  optional int64 first_show = 7;
  optional int64 session_id = 8;
  optional int64 input_interval = 9;
  optional int64 press_process_cost = 10;
  optional int64 candidate_prepare_cost = 11;
  optional int64 candidate_trans_cost = 12;
  optional int64 load_more_send_cost = 13;
  optional int64 more_prepare_cost = 14;
  optional int64 more_trans_cost = 15;
  optional int64 more_process_cost = 16;
  optional int64 ui_trans_cost = 17;
  optional int64 ui_render_cost = 18;
  optional int64 total_cost = 19;
  optional int64 pending_len = 20;
  optional enum<.com.tencent.wrbus.pb.WtKeyboardType> keyboard_type = 21;
